name: koredoko quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation test dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Compile inspection modules
        run: python -m compileall -q src tests
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Emit address-free blinded predictions
        run: python scripts/blind_predict.py
      - name: Compare held-out GSI address reference points
        run: python scripts/blind_evaluate.py

  web-input-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Configure Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check syntax
        run: node --check src/input_review.mjs && node --check src/poi_station_review.mjs && node --check tests/input_review.test.mjs && node --check tests/real_public_listing.test.mjs && node --check src/condition_matcher.mjs && node --check tests/condition_matcher.test.mjs && node --check src/real_walk_calculator.mjs && node --check tests/real_walk_calculator.test.mjs && node --check src/public_building_rank.mjs && node --check tests/public_building_rank.test.mjs && node --check src/route_sensitivity.mjs && node --check tests/route_sensitivity.test.mjs
      - name: Offline browser input tests
        run: node --test tests/input_review.test.mjs tests/real_public_listing.test.mjs tests/condition_matcher.test.mjs tests/real_walk_calculator.test.mjs tests/public_building_rank.test.mjs tests/route_sensitivity.test.mjs
