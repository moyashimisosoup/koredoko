name: koredoko quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation test dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Compile inspection modules
        run: python -m compileall -q src tests
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Emit address-free blinded predictions
        run: python scripts/blind_predict.py
      - name: Compare held-out GSI address reference points
        run: python scripts/blind_evaluate.py

  web-input-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Configure Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Discover all Node test modules automatically. A hand-curated list
      # previously skipped new P1/P2 map and ranking tests while CI was green.
      - name: Check all JavaScript syntax
        run: find src tests scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Run ALL offline Node tests
        run: node --test tests/*.test.mjs

  browser-preview-smoke:
    # Run the heavier local real-browser smoke when a PR leaves Draft.
    # Draft development runs ALL offline tests on each commit; one successful
    # manual milestone preview was already recorded on run 39751927001.
    # This never publishes GitHub Pages.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install pinned browser test runtime
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Install Chromium with Linux dependencies
        run: npx playwright install chromium webkit --with-deps
      - name: Serve PR HTML only on runner localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/koredoko-pr-preview.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/hibari-same-region.html >/dev/null
      - name: Real Chromium desktop and mobile-viewport user-flow smoke
        run: |
          node scripts/browser_smoke.mjs
          node scripts/area_browser_smoke.mjs
      - name: Retain browser previews for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app023-browser-smoke-screenshots
          path: browser-smoke-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
