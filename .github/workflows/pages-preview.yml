name: APP-023 iPhone Pages preview

on:
  push:
    branches:
      - preview/app023-iphone-20261022
  workflow_dispatch:

concurrency:
  group: pages-app023-iphone-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Stage public static web files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage only public web assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/examples
          cp ./*.html _site/
          cp src/*.mjs _site/src/
          cp examples/*.json _site/examples/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/hibari-same-region.html
          test -f _site/src/hibari_partial_evidence_ranking.mjs
          test -f _site/examples/hibari_real_ads_prelocked_20261021.json
          echo "Staged APP-023 preview. PR/main untouched."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish frozen preview to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      # Use an isolated deploy environment: the default github-pages
      # environment may restrict non-main branches.
      name: app023-iphone-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Confirm published HTML, scripts and data over HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the public site through GitHub Pages CDN
        shell: bash
        run: |
          set -euo pipefail
          base="https://moyashimisosoup.github.io/koredoko"
          check() {
            local path="$1" marker="$2" out
            out="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --max-time 25 "$base/$path" --output "$out"
            grep --fixed-strings --quiet "$marker" "$out"
            echo "OK (live): $base/$path"
            rm -f "$out"
          }
          check "index.html" "ad-bridge.html"
          check "hibari-same-region.html" "buildHibariSameRegionMapReview"
          check "src/hibari_same_region_map_view.mjs" "buildHibariSameRegionMapReview"
          check "src/hibari_partial_evidence_ranking.mjs" "buildHibariExploratoryOrder"
          check "examples/hibari_real_ads_prelocked_20261021.json" "hibarigaoka-20261021"
          echo "APP-023 Pages live HTTP content checks complete."
